# Per-machine facts.
#
# Everything a template needs that differs between machines lives here, keyed
# by profile, so changing a machine is one commit plus `chezmoi apply`.
#
# Which profile a machine uses is decided in .chezmoi.toml.tmpl (hostname ->
# profile) and stored in ~/.config/chezmoi/chezmoi.toml. That file is machine
# state and is deliberately not tracked.
